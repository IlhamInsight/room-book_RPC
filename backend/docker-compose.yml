services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking_rpc_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
