services:
  # ========================================================
  # Backend JSON-RPC Service (Flask / Django)
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: booking_rpc_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "8000:8000"
    environment:
      - PORT=5000
      - DEBUG=True
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
      - ./backend/media:/app/media
    networks:
      - dist_network

  # ========================================================
  # Frontend React Web (Nginx)
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: booking_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dist_network

networks:
  dist_network:
    name: dist_network
    driver: bridge
